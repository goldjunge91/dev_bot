joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.15  # ALT: 0.05 — zu klein, Hardware-Drift kam durch
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
      y: 0
    scale_linear:
      x: 0.5
      y: 0.5
    scale_linear_turbo:
      x: 1.0
      y: 1.0

    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 0.5
    scale_angular_turbo:
      yaw: 1.0

    # Enable-Button: Roboter faehrt NUR wenn dieser Button gehalten wird
    # Button 0 = A (Xbox) / Cross (PS) / B (Switch)
    # ALT: enable_button: -1  — war deaktiviert, Roboter fuhr unkontrolliert
    enable_button: 0
    enable_turbo_button: 1  # Button 1 = B (Xbox) / Circle (PS) fuer Vollgas

    # ALT: require_enable_button: false  — hat unkontrolliertes Vorwaertsfahren verursacht
    require_enable_button: true
