controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    mecanum_cont:
      type: mecanum_drive_controller/MecanumDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

    shooter_controller:
      type: velocity_controllers/JointGroupVelocityController

    tilt_controller:
      type: position_controllers/JointGroupPositionController

    arming_controller:
      type: position_controllers/JointGroupPositionController

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

mecanum_cont:
  ros__parameters:
    # Schema: mecanum_drive_controller (ROS2 Humble) — verified via official docs
    # https://control.ros.org/humble/doc/ros2_controllers/mecanum_drive_controller/doc/userdoc.html
    # ROS2 Humble: Pflichtparameter ist front_left_wheel_name (NICHT _command_joint_name)
    # _command_joint_name ist ab Rolling/Jazzy gültig
    front_left_wheel_name:  front_left_wheel_joint
    front_right_wheel_name: front_right_wheel_joint
    rear_left_wheel_name:   rear_left_wheel_joint
    rear_right_wheel_name:  rear_right_wheel_joint

    # ALT (Rolling/Jazzy API — auf Humble nicht unterstützt):
    # front_left_wheel_command_joint_name:  front_left_wheel_joint
    # front_right_wheel_command_joint_name: front_right_wheel_joint
    # rear_left_wheel_command_joint_name:   rear_left_wheel_joint
    # rear_right_wheel_command_joint_name:  rear_right_wheel_joint

    use_stamped_vel: false

    # Kinematics — providing both nested and flat variants
    kinematics:
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      wheels_radius: 0.033
      sum_of_robot_center_projection_on_X_Y_axis: 0.2615

    # ALT: Kinematik-Parameter auf Controller-Toplevel (auskommentiert)
    # wheels_radius: 0.033
    # sum_of_robot_center_projection_on_X_Y_axis: 0.2615

    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    reference_timeout: 0.5
    publish_rate: 50.0

    # Velocity and acceleration limits
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0

    linear.y.has_velocity_limits: true
    linear.y.max_velocity: 1.0
    linear.y.min_velocity: -1.0
    linear.y.max_acceleration: 1.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.0

joint_broad:
  ros__parameters: {}

shooter_controller:
  ros__parameters:
    joints:
      - dart_pusher_joint

tilt_controller:
  ros__parameters:
    joints:
      - trigger_joint
    gains:
      trigger_joint:
        p: 50.0
        i: 0.0
        d: 1.0

arming_controller:
  ros__parameters:
    joints:
      - system_arming_joint

imu_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
