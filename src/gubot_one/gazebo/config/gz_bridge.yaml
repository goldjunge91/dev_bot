# Globaler Gazebo-Bridge — nur /clock (wie Referenz rosbot_gazebo/config/gz_bridge.yaml)
# ALT: enthielt auch scan und camera/camera_info (falscher Scope — jetzt in gubot_bridge.yaml)
# Sensor-Topics werden per-Robot in gubot_bridge.yaml gebridget (spawn_robot.launch.py)
  - topic_name: /clock
    ros_type_name: rosgraph_msgs/msg/Clock
    gz_type_name: gz.msgs.Clock
    direction: GZ_TO_ROS
