detect_face:
  ros__parameters:
    encodings_path: "~/.ros/face_detector/encodings.pkl"
    tolerance: 0.6          # Schwellwert für Gesichtsvergleich (niedriger = strenger)
    model: "hog"            # "hog" (schnell, CPU) oder "cnn" (genauer, GPU empfohlen)

follow_face:
  ros__parameters:
    rcv_timeout_secs: 1.0
    angular_chase_multiplier: 0.7
    forward_chase_speed: 0.1
    search_angular_speed: 0.5
    max_size_thresh: 0.3    # Normalisierte Gesichtsgröße ab der nicht mehr vorgefahren wird
    filter_value: 0.9       # Tiefpassfilter für Bewegungsglättung
    target_person: ""       # Leer = erstes bekannte Gesicht; z.B. "marco" für bestimmte Person
