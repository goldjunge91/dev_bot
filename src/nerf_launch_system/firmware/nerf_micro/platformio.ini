; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; platformio run / Upload nur für leonardo — native-Envs sind test-only
default_envs = leonardo

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
lib_deps =
    arduino-libraries/Servo@^1.3.0
; GTest läuft nicht auf AVR — alle test/-Ordner für leonardo ignorieren
test_ignore = *

; FSM Tests — unser eigener test/mock/Arduino.h
[env:native]
platform = native
test_framework = googletest
test_filter = test_fsm
; Kein src/ vorhanden — platformio run blockieren
targets = test
build_flags =
    -std=c++17
    -DUNIT_TEST
    -I test/mock
    -I include
    -I lib/FSM
    -I lib/Control
build_src_filter = -<*>
test_ignore = mock, mock_launcher
lib_compat_mode = off
lib_ignore = Servo, Comms, Control, Utils, Debug, FSM
lib_deps =
    google/googletest@^1.17.0

; Launcher Tests — GMock-basierter selbstständiger Mock
[env:native_launcher]
platform = native
test_framework = googletest
test_filter = test_launcher
; Kein src/ vorhanden — platformio run blockieren
targets = test
build_flags =
    -std=c++17
    -DUNIT_TEST
    -I test/mock_launcher
    -I include
    -I lib/FSM
    -I lib/Control
    -I lib/Utils
build_src_filter = -<*>
test_ignore = mock, mock_launcher
lib_compat_mode = off
lib_ignore = Servo, Comms, Control, Utils, Debug, FSM
lib_deps =
    google/googletest@^1.17.0
