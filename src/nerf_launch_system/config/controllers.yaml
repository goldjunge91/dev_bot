controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    tilt_controller:
      type: position_controllers/JointGroupPositionController

    shooter_controller:
      type: position_controllers/JointGroupPositionController

    arming_controller:
      type: forward_command_controller/ForwardCommandController

tilt_controller:
  ros__parameters:
    joints:
      - tilt_joint

shooter_controller:
  ros__parameters:
    joints:
      - shooter_joint

arming_controller:
  ros__parameters:
    joints:
      - system_arming_joint
    interface_name: position
