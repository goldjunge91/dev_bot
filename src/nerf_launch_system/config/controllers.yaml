controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    trigger_controller:
      type: position_controllers/JointGroupPositionController

    # flywheel_controller: Entfernt – Firmware-FSM steuert Flywheels autonom via SHOT
    #   type: velocity_controllers/JointGroupVelocityController

    pusher_controller:
      type: velocity_controllers/JointGroupVelocityController

    arming_controller:
      type: forward_command_controller/ForwardCommandController

trigger_controller:
  ros__parameters:
    joints:
      - trigger_joint

pusher_controller:
  ros__parameters:
    joints:
      - dart_pusher_joint

arming_controller:
  ros__parameters:
    joints:
      - system_arming_joint
    interface_name: position  # ForwardCommandController: position interface (passend zu URDF command_interface="position")
