---
controller_manager:
  ros__parameters:
    update_rate: 30

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

mecanum_drive_controller:
  ros__parameters:
    # -------------------------------------------------------------------------
    # Wheel joint names — Husarion style (no _command_ suffix)
    # -------------------------------------------------------------------------
    front_left_wheel_name: fl_wheel_joint
    front_right_wheel_name: fr_wheel_joint
    rear_left_wheel_name: rl_wheel_joint
    rear_right_wheel_name: rr_wheel_joint

    # -------------------------------------------------------------------------
    # Geometry — MEASURE YOUR ROBOT (Sprint 7)
    # wheel_separation_x = wheelbase   (front-to-rear distance between wheel centres) = 0.25 m
    # wheel_separation_y = track width (left-to-right distance between wheel centres) = 0.20 m
    # wheel_radius                                                                     = 0.05 m
    # -------------------------------------------------------------------------
    wheel_separation_x: 0.25
    wheel_separation_y: 0.20
    wheel_radius: 0.05

    wheel_separation_x_multiplier: 1.0
    wheel_separation_y_multiplier: 1.0
    wheel_radius_multiplier: 1.0

    # -------------------------------------------------------------------------
    # Odometry mode
    # open_loop: true  = integrate cmd_vel (no encoder feedback needed, good for testing)
    # open_loop: false = use wheel velocity feedback (real hardware, Sprint 7)
    # position_feedback: false = velocity state interface (our hardware interface)
    # -------------------------------------------------------------------------
    open_loop: true
    position_feedback: false

    # -------------------------------------------------------------------------
    # use_stamped_vel: false → subscribes to ~/cmd_vel_unstamped (Twist)
    # Required for teleop_twist_keyboard
    # -------------------------------------------------------------------------
    use_stamped_vel: false

    cmd_vel_timeout: 0.5
    publish_rate: 50.0

    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    velocity_rolling_window_size: 10

    # -------------------------------------------------------------------------
    # Velocity limits
    # -------------------------------------------------------------------------
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0

    linear.y.has_velocity_limits: true
    linear.y.has_acceleration_limits: true
    linear.y.max_velocity: 1.0
    linear.y.min_velocity: -1.0
    linear.y.max_acceleration: 1.0
    linear.y.min_acceleration: -1.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0
