; PlatformIO Project Configuration File — mecanum_pico firmware
; Platform: maxgerhardt/platform-raspberrypi (Earle Philhower arduino-pico)
;
; Layout:
;   src/          → alle .c/.cpp Quellen (main.cpp + lib-Implementierungen)
;   lib/          → Header-only (.h/.hpp) — kein eigener Compile-Schritt
;   include/      → board_config.h
;   test/         → Unit-Tests (native_test env)
;
; pio run              → Firmware-Build für Pico
; pio test -e native_test → PC-seitige Unit-Tests

[platformio]
default_envs = pico

; ---------------------------------------------------------------------------
; Firmware — Raspberry Pi Pico, Earle Philhower arduino-pico
; ---------------------------------------------------------------------------
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; PlatformIO kompiliert alles in src/ automatisch — kein build_src_filter nötig
build_flags =
    -std=gnu++17
    -I include
    -I lib

lib_deps =

; ---------------------------------------------------------------------------
; Native Unit-Tests (PC, kein Pico nötig)
; Nur mit: pio test -e native_test
; ---------------------------------------------------------------------------
[env:native_test]
platform       = native
test_framework = googletest
test_filter    = test_*

build_flags =
    -std=c++17
    -I include
    -I lib
    -I test/include
    -include test/include/maths.hpp
    -I test/include

; test/ enthält test_wheel.cpp, test_pico_comms.cpp — kein Arduino.h nötig
lib_deps =
    google/googletest@^1.17.0
