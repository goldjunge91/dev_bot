controller_manager:
  ros__parameters:
    update_rate: 100
    # use_sim_time: true

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_cont:
      type: diff_drive_controller/DiffDriveController

#    trigger_controller:
#      type: position_controllers/JointGroupPositionController
#
#    flywheel_controller:
#      type: velocity_controllers/JointGroupVelocityController
#
#    pusher_controller:
#      type: velocity_controllers/JointGroupVelocityController

    tilt_controller:
      type: position_controllers/JointGroupPositionController

    shooter_controller:
      type: position_controllers/JointGroupPositionController

    arming_controller:
      type: forward_command_controller/ForwardCommandController

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

diff_cont:
  ros__parameters:

    publish_rate: 100.0

    base_frame_id: base_link

    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.297
    wheel_radius: 0.033

    use_stamped_vel: false

    open_loop: false

    # wheels_per_side: x
    # wheel_separation_multiplier: x
    # left_wheel_radius_multiplier: x
    # right_wheel_radius_multiplier: x

    # odom_frame_id: x
    # pose_covariance_diagonal: x
    # twist_covariance_diagonal: x
    # open_loop: x
    # enable_odom_tf: x

    cmd_vel_timeout: 0.2
    publish_limited_velocity: true
    velocity_rolling_window_size: 10
    

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 0.7
    linear.x.min_velocity: -0.7
    linear.x.max_acceleration: 1.2
    linear.x.min_acceleration: -1.2

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.8
    angular.z.min_velocity: -1.8
    angular.z.max_acceleration: 2.5
    angular.z.min_acceleration: -2.5





