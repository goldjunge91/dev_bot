[pytest]
testpaths = src
python_files = test_*.py
addopts = --strict-markers -p no:cacheprovider --import-mode=importlib -p no:launch_testing -p no:launch_testing_ros -p no:launch_ros
markers =
    copyright: copyright check
    linter: linter check
    flake8: flake8 check
    pep257: pep257 check
